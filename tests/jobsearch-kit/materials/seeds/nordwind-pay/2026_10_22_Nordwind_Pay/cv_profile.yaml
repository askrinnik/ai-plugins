    inline: true
  - id: key-skills
    groups: [backend, messaging, data, cloud]
  - id: work
    jobs:
      - id: example-payments
        bullets: [settlement, api, lead]
      - id: sample-retail
        bullets: [queues, orders]
  - id: projects
    projects: all
  - id: education

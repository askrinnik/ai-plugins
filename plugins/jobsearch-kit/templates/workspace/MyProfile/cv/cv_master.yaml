# CV master content: the single source of CV text. Jordan Sample is a fictional example; replace everything.
# Every claim here must follow MyProfile/candidate_facts.md. The build checks MyProfile/cv/cv_rules.yaml.
# Format: see the top of the plugin's scripts/cv.js. Each section has a "kind": text, list, groups, jobs, projects
# or paras. Profiles select sections, items, groups, jobs and bullets by "id".

header:
  name: Jordan Sample
  # photo: MyProfile/photo.jpg      # optional, relative to the workspace root
  contacts:
    - id: phone
      label: T
      text: "+000 0000 0000"
    - id: email
      label: E
      text: jordan.sample@example.com
      url: mailto:jordan.sample@example.com
    - id: github
      label: GitHub
      text: github.com/example
      url: https://github.com/example
    - id: location
      label: Location
      text: Lisbon, Portugal (open to hybrid work)

titles:
  backend: Senior Backend Engineer (Java)
  lead: Backend Team Lead (Java)

sections:
  - id: summary
    heading: Professional Summary
    kind: text
    variants:
      default: >-
        Senior Backend Engineer with 10 years of Java experience, building payment APIs and event-driven services
        with Spring Boot, PostgreSQL and Kafka. Leads a team of four engineers.
      lead: >-
        Backend team lead who grows engineers and ships reliable payment services: Java, Spring Boot, PostgreSQL
        and Kafka in production.

  - id: soft-skills
    heading: Skills
    kind: list
    items:
      - id: mentoring
        text: Mentoring
      - id: reviews
        text: Code reviews
      - id: ownership
        text: Production ownership

  - id: key-skills
    heading: Key Skills
    kind: groups
    groups:
      - id: backend
        label: Backend
        text: Java 21, Spring Boot, REST API design
      - id: data
        label: Data
        text: PostgreSQL (schema design, query tuning), MySQL
      - id: messaging
        label: Messaging
        text: Kafka, RabbitMQ
      - id: cloud
        label: Cloud
        text: Docker; working knowledge of Kubernetes

  - id: work
    heading: Work History
    kind: jobs
    jobs:
      - id: example-payments
        title: Senior Backend Engineer
        dates: 2019 to present
        company: Example Payments Ltd, Lisbon
        bullets:
          - id: api
            tags: [api]
            text: Develop the payment API that handles **about 2 million requests per day**.
          - id: settlement
            tags: [events]
            text: Moved settlement batch jobs to event-driven processing with Kafka; settlement time fell from 6 hours to 40 minutes.
          - id: lead
            tags: [lead]
            text: Lead a team of four engineers; run code reviews and onboarding.
      - id: sample-retail
        title: Backend Developer
        dates: 2015 to 2019
        company: Sample Retail SA, Porto
        bullets:
          - id: orders
            tags: [api]
            text: Built order and stock services with Java and Spring on MySQL.
          - id: queues
            tags: [events]
            text: Connected the stores and the warehouse through RabbitMQ.

  - id: projects
    heading: Projects
    kind: projects
    projects:
      - id: ledger
        title: Ledger demo
        paras:
          - A small double-entry ledger service, written to try new Java features.
        features:
          - text: Features
            items:
              - Idempotent postings
              - Balance snapshots
        stack: [Java 21, Spring Boot, PostgreSQL]
        role: Sole developer
        link: { text: github.com/example/ledger, url: https://github.com/example/ledger }

  - id: education
    heading: Education
    kind: paras
    paras:
      - BSc in Computer Science, Example University, 2015.

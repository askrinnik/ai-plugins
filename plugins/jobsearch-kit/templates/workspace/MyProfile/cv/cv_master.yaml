# CV master content: the single source of CV text. Replace every <...>.
# Every claim here must follow MyProfile/candidate_facts.md. The build checks MyProfile/cv/cv_rules.yaml.
# Format: see the top of the plugin's scripts/cv.js. Each section has a "kind": text, list, groups, jobs, projects
# or paras. Profiles select sections, items, groups, jobs and bullets by "id".

header:
  name: <Your Name>
  # photo: MyProfile/photo.jpg      # optional, relative to the workspace root
  contacts:
    - id: phone
      label: T
      text: "<phone>"
    - id: email
      label: E
      text: <e-mail>
      url: mailto:<e-mail>
    - id: location
      label: Location
      text: <city, country>

titles:
  main: <your job title>

sections:
  - id: summary
    heading: Professional Summary
    kind: text
    variants:
      default: >-
        <two or three sentences: who you are, your main stack, your strongest result>

  - id: key-skills
    heading: Key Skills
    kind: groups
    groups:
      - id: main
        label: <group, for example Backend>
        text: <skills of this group>

  - id: work
    heading: Work History
    kind: jobs
    jobs:
      - id: job1
        title: <title>
        dates: <start> to <end>
        company: <company, city>
        bullets:
          - id: b1
            tags: [<topic>]
            text: <what you did, with a number if the facts give one>

  - id: education
    heading: Education
    kind: paras
    paras:
      - <degree, school, year>
